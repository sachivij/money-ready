# Game: Scam or Safe? Inbox (on screen)
# How to edit: content/README.md
approved_by: Sumeet
approved_on: 2026-11-01
id: scam-or-safe
multiRound: true
name: Scam or Safe? Inbox (on screen)
emoji: 📱
devices: shared
minutes: 10
group: Whole class, pairs, or solo
energy: Medium
materials:
  - Projector or large screen — or students' own devices
  - "This page open: Games → Scam or Safe? → Play on screen"
summary: A pretend phone inbox. Students read each message, decide Scam or Safe, then see the clues highlighted and why. Works on one shared screen or on each student's own device.
howToPlay:
  - Open Scam or Safe? on the shared screen (or have students open it on their own devices). Pick Younger or Older messages.
  - Read the first message aloud. Students vote Scam or Safe with a thumb, a card, or by tapping.
  - Tap the class's answer. The screen shows whether it was right, the clues to look for, and why.
  - "Before moving on, ask: which clue did you spot first?"
  - At the end the screen shows the score and the four clues to remember. Play again for a new order.
teenTip: If students use their own devices, nothing is recorded or sent — the score lives only on that screen. Ask them to compare scores with a partner, not the whole class.
topics: ["fraud-red-flags", "banking-basics", "smart-shopping"]
reinforces: Spot the four scam clues — hurry, secret, strange payment, too good to be true — and know that real companies never ask for your password.
levels:
  35: Pick Younger. Pairs decide together before you tap.
  68: Pick Older. Students say which clue they spotted before you reveal.
  912: Pick Older on their own devices, then discuss the trickiest ones: the delivery text and the fake bank link.
  k2: Pick Younger. You read every message in a silly voice; the class answers with thumbs up (safe) or crossed arms (scam). Focus on one rule: never tell anyone your password, and tell a grown-up.
debrief:
  - Which message fooled the most people? Why did it work?
  - What do real companies never ask you for?
  - Who is a trusted adult you could show a strange message to?
access: Large text, big buttons that work with a keyboard, and results announced for screen readers. No timer, so slower readers aren't rushed.
play:
  engine: inbox
  clues:
    - id: hurry
      label: Hurry
      tip: They rush you so you don't stop to think.
    - id: secret
      label: Secret
      tip: They tell you not to tell anyone.
    - id: payment
      label: Strange payment
      tip: Gift cards, passwords, or bank details.
    - id: toogood
      label: Too good to be true
      tip: Huge prizes for doing almost nothing.
  messages:
    - level: younger
      from: GameWorld Prizes
      text: YOU WON 10,000 free coins!!! Type your password in 5 minutes to get them!
      scam: true
      clues: ["hurry", "payment", "toogood"]
      why: Real games never ask for your password, and a giant prize for nothing is a trick.
    - level: younger
      from: City Library
      text: Your book is due on Friday. You can renew it at the front desk.
      scam: false
      clues: []
      why: No rush, no money, no secrets — just a normal reminder.
    - level: younger
      from: Unknown number
      text: Hi! I'm a new friend from the game. Don't tell your parents, but send me a picture of your mom's card.
      scam: true
      clues: ["secret", "payment"]
      why: Anyone who asks you to keep a secret from grown-ups, or wants card details, is not a friend.
    - level: younger
      from: Coach Lee
      text: Practice moved to 4pm tomorrow because of rain. See you there!
      scam: false
      clues: []
      why: Someone you know, sharing information, asking for nothing.
    - level: younger
      from: Free Puppy Club
      text: Click here to get a FREE puppy today! Only the first 3 people win!
      scam: true
      clues: ["hurry", "toogood"]
      why: A free puppy for a click, and a rush to be first — two clues at once.
    - level: older
      from: Sam (friend)
      text: I'm stuck!! Can you buy a $50 gift card and text me the code? Don't tell anyone pls
      scam: true
      clues: ["hurry", "secret", "payment"]
      why: A friend's account can be hacked. Gift card codes plus secrecy is a classic scam — call Sam another way to check.
    - level: older
      from: Securty Team
      text: Your account will be DELETED today. Confirm your bank login here: bank-verify-now.co
      scam: true
      clues: ["hurry", "payment"]
      why: Misspelled sender, a lookalike link, and a deadline. Real banks never ask for your login by message.
    - level: older
      from: Shoe Store
      text: Thanks for your order! It ships Tuesday. Track it any time in our app.
      scam: false
      clues: []
      why: Safe if you really ordered. Check in the store's real app — don't tap links in texts you weren't expecting.
    - level: older
      from: Hiring Now
      text: Work from home, earn $500/day! Just pay a $40 starter fee to begin.
      scam: true
      clues: ["payment", "toogood"]
      why: You never pay to get a job, and $500 a day for no experience is too good to be true.
    - level: older
      from: School Office
      text: Picture day is next Thursday. Order forms come home in backpacks this week.
      scam: false
      clues: []
      why: Normal school news. Nothing to click, nothing to pay right now.
    - level: older
      from: Prize Center
      text: You've been selected for a $1,000 gift card! Just pay $4.99 shipping to claim.
      scam: true
      clues: ["payment", "toogood"]
      why: You didn't enter anything, and a 'small fee' to get a big prize is how they get your card number.
